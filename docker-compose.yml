# 精密试验场授时网络追溯树规划台
#
# 宿主机端口通过环境变量 HOST_PORT 配置（默认 8080）：
#   HOST_PORT=9090 docker compose up -d web
#
# verify 为一次性服务：运行单元测试、生产构建，并对 web 静态站点做 HTTP 冒烟，
# 全部通过后以退出码 0 自行退出（失败为非零）：
#   docker compose run --rm verify

services:
  web:
    build:
      context: .
      target: runtime
    image: timing-planner-web:latest
    ports:
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    image: timing-planner-verify:latest
    environment:
      SMOKE_BASE_URL: http://web
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
