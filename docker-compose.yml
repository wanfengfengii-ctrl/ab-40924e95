name: timing-network-planner

services:
  # 静态站点：纯前端规划台（nginx）
  app:
    build:
      context: .
      target: app
    image: timing-network-planner-app:latest
    ports:
      # 宿主机端口可通过环境变量配置：APP_PORT=9000 docker compose up app
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # 一次性验证：代码测试 → 生产构建 → 静态站点 HTTP 冒烟，结束后自行退出
  # 用法：docker compose run --rm verify （退出码即验证结果）
  verify:
    build:
      context: .
      target: verify
    image: timing-network-planner-verify:latest
